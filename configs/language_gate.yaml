# configs/acceptance_gate.yaml
# ────────────────────────────
# Part 3 Acceptance Gate: GPT-2 on WikiText-2, seed=42, 50 chunks
# Run: python run_sweep.py --config configs/acceptance_gate.yaml

modality: language
model_name: gpt2
seeds: [42, 99]
n_chunks: 50
seq_len: 1024
block_size: 32
device: auto

quant_modes:
  - fp32
  - bf16
  - nvfp4
  - mxfp8_e4m3
  - mxfp8_e5m2
  - mxfp8_e5m2_residual
  - mxfp4
  - mxfp4_residual
  - mxfp4_residual_act_only
  - mxfp4_residual_weight_only
  - mxfp4_adaptive_18
  - m2xfp
