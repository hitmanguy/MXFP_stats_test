# configs/vision_gate.yaml
# ─────────────────────────────
# Vision evaluation sweep: ResNet-18 on ImageNet-1k (val)

modality: vision
model_name: resnet18
seeds: [42]
n_batches: 100
batch_size: 32
block_size: 32
device: auto

quant_modes:
  - fp32
  - bf16
  - mxfp4
  - nvfp4
  - mxfp8_e4m3
  - mxfp8_e5m2
  - mxfp4_residual
  - mxfp8_e5m2_residual
  - mxfp4_adaptive_18
  - mxfp4_residual_act_only
  - mxfp4_residual_weight_only
